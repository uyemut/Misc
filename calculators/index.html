<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Calculator</title>
    <style>
        :root {
            --bg-gradient-start: #f3f4f6;
            --bg-gradient-end: #d1d5db;
            --calc-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #9ca3af;
            
            /* Button Colors */
            --btn-num-bg: #f9fafb;
            --btn-num-hover: #f3f4f6;
            --btn-op-bg: #dbeafe;
            --btn-op-text: #2563eb;
            --btn-op-hover: #bfdbfe;
            --btn-ac-bg: #fee2e2;
            --btn-ac-text: #dc2626;
            --btn-ac-hover: #fecaca;
            --btn-del-bg: #f3f4f6;
            --btn-del-text: #374151;
            --btn-del-hover: #e5e7eb;
            --btn-eq-bg: #3b82f6;
            --btn-eq-text: #ffffff;
            --btn-eq-hover: #2563eb;
            
            /* Borders and Shadows */
            --border-color: #e5e7eb;
            --shadow-calc: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-btn: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-btn-heavy: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom right, var(--bg-gradient-start), var(--bg-gradient-end));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1rem;
            box-sizing: border-box;
        }

        .calculator {
            background: var(--calc-bg);
            padding: 1.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-calc);
            width: 100%;
            max-width: 24rem;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .display {
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0 0.5rem;
        }

        .previous-operand {
            color: var(--text-muted);
            font-size: 0.875rem;
            min-height: 1.25rem;
            font-family: monospace;
            letter-spacing: 0.05em;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .current-operand {
            color: var(--text-main);
            font-size: 2.25rem;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 0.1em;
            word-break: break-all;
            min-height: 3rem;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            overflow: hidden;
            max-width: 100%;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .btn {
            border: none;
            outline: none;
            padding: 1rem 0;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            user-select: none;
            box-shadow: var(--shadow-btn);
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.span-2 {
            grid-column: span 2;
        }

        .btn-ac { background: var(--btn-ac-bg); color: var(--btn-ac-text); }
        .btn-ac:hover { background: var(--btn-ac-hover); }

        .btn-del { background: var(--btn-del-bg); color: var(--btn-del-text); }
        .btn-del:hover { background: var(--btn-del-hover); }

        .btn-op { background: var(--btn-op-bg); color: var(--btn-op-text); font-size: 1.5rem; font-weight: 700; }
        .btn-op:hover { background: var(--btn-op-hover); }

        .btn-num { background: var(--btn-num-bg); color: var(--text-main); }
        .btn-num:hover { background: var(--btn-num-hover); }

        .btn-eq { background: var(--btn-eq-bg); color: var(--btn-eq-text); font-size: 1.5rem; font-weight: 700; box-shadow: var(--shadow-btn-heavy); }
        .btn-eq:hover { background: var(--btn-eq-hover); }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div id="previous-operand" class="previous-operand"></div>
            <div id="current-operand" class="current-operand">0</div>
        </div>

        <div class="keypad">
            <button class="btn btn-ac span-2" data-action="clear">AC</button>
            <button class="btn btn-del" data-action="delete">DEL</button>
            <button class="btn btn-op" data-action="operation">÷</button>

            <button class="btn btn-num" data-action="number">7</button>
            <button class="btn btn-num" data-action="number">8</button>
            <button class="btn btn-num" data-action="number">9</button>
            <button class="btn btn-op" data-action="operation">×</button>

            <button class="btn btn-num" data-action="number">4</button>
            <button class="btn btn-num" data-action="number">5</button>
            <button class="btn btn-num" data-action="number">6</button>
            <button class="btn btn-op" data-action="operation">−</button>

            <button class="btn btn-num" data-action="number">1</button>
            <button class="btn btn-num" data-action="number">2</button>
            <button class="btn btn-num" data-action="number">3</button>
            <button class="btn btn-op" data-action="operation">+</button>

            <button class="btn btn-num" data-action="number">.</button>
            <button class="btn btn-num" data-action="number">0</button>
            <button class="btn btn-eq span-2" data-action="compute">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                if (this.currentOperand === '0') return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                if (this.currentOperand === '') this.currentOperand = '0';
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
                if(this.currentOperand.length > 12) {
                     this.currentOperand = this.currentOperand.slice(0, 12);
                }
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '' && operation === '-') {
                     this.currentOperand = '-';
                     this.updateDisplay();
                     return;
                }
                if (this.currentOperand === '' && this.previousOperand !== '') {
                    this.operation = operation;
                    this.updateDisplay();
                    return;
                }
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+': computation = prev + current; break;
                    case '-': computation = prev - current; break;
                    case '×': computation = prev * current; break;
                    case '÷': 
                        if (current === 0) {
                            // Offline fallback for messages
                            const errorMsg = document.createElement('div');
                            errorMsg.innerText = "Cannot divide by zero";
                            errorMsg.style.cssText = "position:absolute; top:10px; background:#fee2e2; color:#dc2626; padding:10px; border-radius:5px;";
                            document.body.appendChild(errorMsg);
                            setTimeout(() => errorMsg.remove(), 2000);
                            this.clear();
                            return;
                        }
                        computation = prev / current; 
                        break;
                    default: return;
                }
                this.currentOperand = Math.round(computation * 100000000) / 100000000;
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            getDisplayNumber(number) {
                const stringNumber = number.toString();
                if (stringNumber === '-') return '-'; 
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                if (this.currentOperand === '0') {
                    this.currentOperandTextElement.innerText = '0';
                } else if (this.currentOperand === '-') {
                    this.currentOperandTextElement.innerText = '-';
                } else {
                     this.currentOperandTextElement.innerText = this.getDisplayNumber(this.currentOperand);
                }

                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
            }
        }

        const previousOperandTextElement = document.getElementById('previous-operand');
        const currentOperandTextElement = document.getElementById('current-operand');
        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

        // Bind DOM events instead of using inline HTML onclick handlers to make JS more modular
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                const value = button.innerText;

                if (action === 'number') calculator.appendNumber(value);
                if (action === 'operation') calculator.chooseOperation(value);
                if (action === 'clear') calculator.clear();
                if (action === 'delete') calculator.delete();
                if (action === 'compute') calculator.compute();
            });
        });

        document.addEventListener('keydown', e => {
            if(e.key >= 0 && e.key <= 9 || e.key === '.') calculator.appendNumber(e.key);
            if(e.key === '=' || e.key === 'Enter') { e.preventDefault(); calculator.compute(); }
            if(e.key === 'Backspace') calculator.delete();
            if(e.key === 'Escape') calculator.clear();
            if(e.key === '+' || e.key === '-') calculator.chooseOperation(e.key);
            if(e.key === '*') calculator.chooseOperation('×');
            if(e.key === '/') { e.preventDefault(); calculator.chooseOperation('÷'); }
        });
    </script>
</body>
</html>
